{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold text-dark">Internal Server Error</h3>
    <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please check application logs.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom px-4 rounded-pill">
        <i class="fa-solid fa-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
