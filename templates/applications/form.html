{% extends "base.html" %}

{% block title %}New Application{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Submit Student Application</h1>
        <p class="page-subtitle">Associate a student candidate with an open corporate placement opening.</p>
    </div>
    <div>
        <a href="{{ url_for('applications.index') }}" class="btn btn-light btn-sm border rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Applications
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="content-card">
            <div class="card-header-custom">
                <h6 class="card-title-custom">
                    <i class="fa-solid fa-file-signature text-primary"></i>
                    Application Submission Form
                </h6>
            </div>
            <div class="p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Select Candidate Student <span class="text-danger">*</span></label>
                            <select name="student_id" class="form-select" required>
                                <option value="">Choose Student...</option>
                                {% for s in students %}
                                <option value="{{ s.id }}">{{ s.name }} ({{ s.student_id }}) - CGPA: {{ s.cgpa }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Select Target Job Opening <span class="text-danger">*</span></label>
                            <select name="job_id" class="form-select" required>
                                <option value="">Choose Job Opening...</option>
                                {% for j in jobs %}
                                <option value="{{ j.id }}">{{ j.title }} &bull; {{ j.company.name }} (₹{{ j.salary_ctc }} LPA)</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Application Date</label>
                            <input type="date" name="application_date" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Initial Pipeline Status</label>
                            <select name="status" class="form-select">
                                <option value="Applied" selected>Applied</option>
                                <option value="Shortlisted">Shortlisted</option>
                                <option value="Assessment">Assessment</option>
                                <option value="Interview">Interview</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Coordinator Remarks</label>
                            <textarea name="remarks" class="form-control" rows="3" placeholder="Notes on candidate qualification, referral, or initial screening..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('applications.index') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-4">Submit Application</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
